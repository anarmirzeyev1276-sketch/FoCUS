<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FoCUS</title>
<style>
:root{--bg:#0a1620;--card:#10222e;--line:#1d3a4a;--teal:#35d0d6;--amber:#f6b400;--t:#e6f1f2;--m:#8aa6ae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:56px 24px 40px;
  background:radial-gradient(ellipse at 50% 62%,#12384a 0%,var(--bg) 62%)}
.brand{margin:0;font-size:46px;font-weight:800;letter-spacing:.5px;color:var(--t)}
.brand i{font-style:normal;color:var(--amber)}
.tag{margin:6px 0 0;color:var(--m);font-size:16px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.ring{position:relative;width:210px;height:210px;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed var(--line);animation:spin 28s linear infinite}
.ring img{width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 6px var(--card),0 18px 60px rgba(53,208,214,.28)}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{width:100%;max-width:320px;padding:16px;border-radius:14px;background:var(--amber);color:#1b1400;font-size:18px;font-weight:700}
.enter:active{transform:scale(.98)}
.ver{margin:14px 0 0;color:var(--m);font-size:13px}

/* ---------- toolbar ---------- */
#bar{position:relative;height:136px;padding:6px 10px 8px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.r1,.r3{height:36px;display:flex;align-items:center;gap:8px}
.r1 img{width:28px;height:28px;border-radius:50%}
.r1 b{font-size:17px;letter-spacing:.3px}
.r1 b i{font-style:normal;color:var(--amber)}
.sp{flex:1}
.ib{width:40px;height:34px;border-radius:10px;font-size:18px;display:grid;place-items:center;background:#0d1c27}
.ib:active{background:var(--line)}
.r2{height:42px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-radius:21px;background:#07121a;border:1px solid var(--line)}
.r2:focus-within{border-color:var(--teal)}
.r2 input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--t);font-size:16px}
.r2 input::placeholder{color:var(--m)}
.go{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#06242a;font-weight:800;font-size:17px}
.r3{justify-content:space-between}
.r3 .ib{flex:1}
#pg{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--amber);transition:width .2s}

/* ---------- home ---------- */
main{height:calc(100% - 136px);overflow:auto;padding:26px 20px 30px;text-align:center}
main .big{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 5px var(--card),0 10px 36px rgba(53,208,214,.25)}
main h2{margin:16px 0 4px;font-size:26px}
main h2 i{font-style:normal;color:var(--amber)}
main p{margin:0 0 22px;color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--card)}
.chip b{font-size:12px}
.chip.on{border-color:#1f6e73}.chip.on b{color:var(--teal)}
.chip.off{color:var(--m)}.chip.off b{color:#d0584f}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px;margin:0 auto}
.links button{padding:14px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.links button:active{border-color:var(--teal)}

/* ---------- settings ---------- */
#set{height:calc(100% - 136px);overflow:auto;padding:16px 16px 40px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.head h3{margin:0;font-size:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.row input{position:absolute;opacity:0;pointer-events:none}
.row u{flex:none;position:relative;width:46px;height:26px;border-radius:13px;background:#27414f;transition:background .15s}
.row u::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.row input:checked+u{background:var(--teal)}
.row input:checked+u::after{transform:translateX(20px)}
[dir=rtl] .row input:checked+u::after{transform:translateX(-20px)}
[dir=rtl] .row u::after{left:auto;right:3px}
select{width:100%;margin:6px 0 16px;padding:13px;border-radius:12px;background:var(--card);color:var(--t);border:1px solid var(--line);font-size:16px}
.lbl{display:block;margin-top:14px;color:var(--m);font-size:14px}
.wipe{width:100%;margin-top:22px;padding:14px;border-radius:12px;background:#3a1a1a;color:#ff9b93;border:1px solid #6a2b2b;font-weight:700}
</style>
</head>
<body>

<div id="splash">
  <h1 class="brand">Fo<i>CUS</i></h1>
  <p class="tag" data-i="0"></p>
  <div class="stage"><div class="ring"><img src="logo.png" alt="FoCUS"></div></div>
  <button class="enter" id="enter" data-i="1"></button>
  <p class="ver">V1 &middot; Chromium</p>
</div>

<div id="app" hidden>
  <header id="bar">
    <div class="r1">
      <img src="logo.png" alt=""><b>Fo<i>CUS</i></b><span class="sp"></span>
      <button class="ib" onclick="openSettings()" aria-label="Settings">&#9881;</button>
    </div>
    <div class="r2">
      <span>&#128274;</span>
      <input id="url" dir="ltr" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
      <button class="go" onclick="go()">&#10140;</button>
    </div>
    <div class="r3">
      <button class="ib" onclick="Android.back()" aria-label="Back">&#9664;</button>
      <button class="ib" onclick="Android.forward()" aria-label="Forward">&#9654;</button>
      <button class="ib" onclick="Android.reload()" aria-label="Reload">&#10227;</button>
      <button class="ib" onclick="showHome()" aria-label="Home">&#8962;</button>
    </div>
    <i id="pg"></i>
  </header>

  <main id="home">
    <img class="big" src="logo.png" alt="">
    <h2>Fo<i>CUS</i></h2>
    <p data-i="0"></p>
    <div class="chips" id="chips"></div>
    <div class="links">
      <button onclick="go('https://duckduckgo.com')">DuckDuckGo</button>
      <button onclick="go('https://www.startpage.com')">Startpage</button>
      <button onclick="go('https://search.brave.com')">Brave Search</button>
      <button onclick="go('https://wikipedia.org')">Wikipedia</button>
    </div>
  </main>

  <section id="set" hidden>
    <div class="head"><h3 data-i="3"></h3><button class="ib" onclick="closeSettings()">&#10005;</button></div>
    <label class="lbl" data-i="4"></label>
    <select id="lang"></select>
    <div id="opts"></div>
    <button class="wipe" id="wipe" data-i="10"></button>
  </section>
</div>

const BAR=136;
const P={lang:"az",js:true,tp:true,clr:true,trk:true,https:false,shot:true};
const $=id=>document.getElementById(id);
let browsing=false;

try{Object.assign(P,JSON.parse(Android.getPrefs()))}catch(e){}

function T(i){const l=LANGS.find(x=>x[0]===P.lang)||LANGS[0];return l[2].split("|")[i]}
function save(){try{Android.savePrefs(JSON.stringify(P))}catch(e){}}
function full(f){try{Android.setFull(f,BAR)}catch(e){}}

function applyLang(){
  const rtl=["ar","fa","he"].includes(P.lang);
  document.documentElement.dir=rtl?"rtl":"ltr";
  document.documentElement.lang=P.lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(+e.dataset.i));
  $("url").placeholder=T(2);
}

const OPTS=[["js",5],["tp",6],["clr",7],["trk",8],["https",9],["shot",11]];

function renderChips(){
  $("chips").innerHTML=[["tp",6],["clr",7],["trk",8],["https",9],["shot",11],["js",5]]
    .map(([k,i])=>`<span class="chip ${P[k]?"on":"off"}"><b>${P[k]?"&#10003;":"&#10005;"}</b>${T(i)}</span>`).join("");
}

function buildSet(){
  $("opts").innerHTML=OPTS.map(([k,i])=>
    `<label class="row"><span>${T(i)}</span><input type="checkbox" data-k="${k}" ${P[k]?"checked":""}><u></u></label>`).join("");
  document.querySelectorAll("#opts input").forEach(c=>c.onchange=()=>{P[c.dataset.k]=c.checked;save();renderChips()});
}

function refresh(){applyLang();renderChips();buildSet()}

function go(v){
  v=(v||$("url").value).trim();
  if(!v)return;
  $("url").blur();
  $("home").hidden=true;$("set").hidden=true;
  browsing=true;
  Android.go(v);
}
function showHome(){
  browsing=false;$("url").value="";$("pg").style.width="0";
  $("set").hidden=true;$("home").hidden=false;full(true);
}
function openSettings(){$("home").hidden=true;$("set").hidden=false;full(true)}
function closeSettings(){
  $("set").hidden=true;
  if(browsing){full(false)}else{$("home").hidden=false}
}
function onUrl(u){$("url").value=u;browsing=true}
function onProgress(p){const b=$("pg");b.style.width=p+"%";if(p>=100)setTimeout(()=>b.style.width="0",250)}
function onBackKey(){
  if(!$("set").hidden){closeSettings();return "ok"}
  return "exit";
}

/* init */
$("lang").innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");
$("lang").value=P.lang;
$("lang").onchange=e=>{P.lang=e.target.value;save();refresh()};
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
$("enter").onclick=()=>{$("splash").hidden=true;$("app").hidden=false;showHome()};
$("wipe").onclick=()=>{
  try{Android.wipe()}catch(e){}
  const b=$("wipe");b.textContent="\u2713";setTimeout(()=>b.textContent=T(10),1200);
};
refresh();
</script>
</body>
</html>
