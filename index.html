<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FoCUS</title>
<style>
:root{--bg:#0a1620;--card:#10222e;--line:#1d3a4a;--teal:#35d0d6;--amber:#f6b400;--t:#e6f1f2;--m:#8aa6ae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:56px 24px 40px;
  background:radial-gradient(ellipse at 50% 62%,#12384a 0%,var(--bg) 62%)}
.brand{margin:0;font-size:46px;font-weight:800;letter-spacing:.5px;color:var(--t)}
.brand i{font-style:normal;color:var(--amber)}
.tag{margin:6px 0 0;color:var(--m);font-size:16px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.ring{position:relative;width:210px;height:210px;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed var(--line);animation:spin 28s linear infinite}
.ring img{width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 6px var(--card),0 18px 60px rgba(53,208,214,.28)}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{width:100%;max-width:320px;padding:16px;border-radius:14px;background:var(--amber);color:#1b1400;font-size:18px;font-weight:700}
.enter:active{transform:scale(.98)}
.ver{margin:14px 0 0;color:var(--m);font-size:13px}

/* ---------- toolbar ---------- */
#bar{position:relative;height:136px;padding:6px 10px 8px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.r1,.r3{height:36px;display:flex;align-items:center;gap:8px}
.r1 img{width:28px;height:28px;border-radius:50%}
.r1 b{font-size:17px;letter-spacing:.3px}
.r1 b i{font-style:normal;color:var(--amber)}
.sp{flex:1}
.ib{width:40px;height:34px;border-radius:10px;font-size:18px;display:grid;place-items:center;background:#0d1c27}
.ib:active{background:var(--line)}
.r2{height:42px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-radius:21px;background:#07121a;border:1px solid var(--line)}
.r2:focus-within{border-color:var(--teal)}
.r2 input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--t);font-size:16px}
.r2 input::placeholder{color:var(--m)}
.go{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#06242a;font-weight:800;font-size:17px}
.r3{justify-content:space-between}
.r3 .ib{flex:1}
#pg{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--amber);transition:width .2s}

/* ---------- home ---------- */
main{height:calc(100% - 136px);overflow:auto;padding:26px 20px 30px;text-align:center}
main .big{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 5px var(--card),0 10px 36px rgba(53,208,214,.25)}
main h2{margin:16px 0 4px;font-size:26px}
main h2 i{font-style:normal;color:var(--amber)}
main p{margin:0 0 22px;color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--card)}
.chip b{font-size:12px}
.chip.on{border-color:#1f6e73}.chip.on b{color:var(--teal)}
.chip.off{color:var(--m)}.chip.off b{color:#d0584f}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px;margin:0 auto}
.links button{padding:14px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.links button:active{border-color:var(--teal)}

/* ---------- settings ---------- */
#set{height:calc(100% - 136px);overflow:auto;padding:16px 16px 40px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.head h3{margin:0;font-size:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.row input{position:absolute;opacity:0;pointer-events:none}
.row u{flex:none;position:relative;width:46px;height:26px;border-radius:13px;background:#27414f;transition:background .15s}
.row u::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.row input:checked+u{background:var(--teal)}
.row input:checked+u::after{transform:translateX(20px)}
[dir=rtl] .row input:checked+u::after{transform:translateX(-20px)}
[dir=rtl] .row u::after{left:auto;right:3px}
select{width:100%;margin:6px 0 16px;padding:13px;border-radius:12px;background:var(--card);color:var(--t);border:1px solid var(--line);font-size:16px}
.lbl{display:block;margin-top:14px;color:var(--m);font-size:14px}
.wipe{width:100%;margin-top:22px;padding:14px;border-radius:12px;background:#3a1a1a;color:#ff9b93;border:1px solid #6a2b2b;font-weight:700}

.ver-b{display:inline-block;margin-inline-start:6px;padding:2px 7px;border-radius:8px;background:var(--amber);color:#1b1400;font-size:11px;font-weight:800;vertical-align:middle;letter-spacing:.3px}
.brand .ver-b{font-size:14px;padding:3px 9px;margin-inline-start:10px}
main h2 .ver-b{font-size:12px}
.tcb span{display:grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border:2px solid var(--t);border-radius:6px;font-size:12px;font-weight:700}
#tabs{height:calc(100% - 136px);overflow:auto;padding:16px 16px 30px}
.tab{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;margin-bottom:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tab.cur{border-color:var(--teal)}
.tab .tt{flex:1;min-width:0;text-align:start}
.tab .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .tt small{display:block;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.btn2{width:100%;padding:14px;border-radius:12px;font-weight:700;margin-top:6px}
.nt{background:var(--teal);color:#06242a}
.ca{background:#3a1a1a;color:#ff9b93;border:1px solid #6a2b2b}
.pinbtn{flex:none;padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--teal);color:var(--teal);font-weight:700}
#kp{position:fixed;inset:0;z-index:99;background:radial-gradient(ellipse at 50% 30%,#12384a 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;padding:44px 24px 24px;overflow:auto}
#kpx{position:absolute;top:14px;inset-inline-end:14px}
#kp img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 5px var(--card)}
#kpt{margin:18px 0 6px;font-size:20px;font-weight:700;text-align:center}
#kpe{min-height:22px;color:#ff9b93;font-size:14px}
.dots{display:flex;gap:14px;margin:10px 0 22px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--teal)}
.dots i.f{background:var(--teal)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:62px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:600}
.pad button:active{background:var(--line)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-10px)}60%{transform:translateX(10px)}}
</style>
</head>
<body>

<div id="splash">
  <h1 class="brand">Fo<i>CUS</i><span class="ver-b">V1.1</span></h1>
  <p class="tag" data-i="0"></p>
  <div class="stage"><div class="ring"><img src="logo.png" alt="FoCUS"></div></div>
  <button class="enter" id="enter" data-i="1"></button>
  <p class="ver">V1.1 &middot; Chromium</p>
</div>

<div id="app" hidden>
  <header id="bar">
    <div class="r1">
      <img src="logo.png" alt=""><b>Fo<i>CUS</i></b><span class="ver-b">V1.1</span><span class="sp"></span>
      <button class="ib" onclick="openSettings()" aria-label="Settings">&#9881;</button>
    </div>
    <div class="r2">
      <span>&#128274;</span>
      <input id="url" dir="ltr" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
      <button class="go" onclick="go()">&#10140;</button>
    </div>
    <div class="r3">
      <button class="ib" onclick="Android.back()" aria-label="Back">&#9664;</button>
      <button class="ib" onclick="Android.forward()" aria-label="Forward">&#9654;</button>
      <button class="ib" onclick="Android.reload()" aria-label="Reload">&#10227;</button>
      <button class="ib" onclick="showHome()" aria-label="Home">&#8962;</button>
      <button class="ib tcb" onclick="openTabs()" aria-label="Tabs"><span id="tc">1</span></button>
    </div>
    <i id="pg"></i>
  </header>

  <main id="home">
    <img class="big" src="logo.png" alt="">
    <h2>Fo<i>CUS</i><span class="ver-b">V1.1</span></h2>
    <p data-i="0"></p>
    <div class="chips" id="chips"></div>
    <div class="links">
      <button onclick="go('https://duckduckgo.com')">DuckDuckGo</button>
      <button onclick="go('https://www.startpage.com')">Startpage</button>
      <button onclick="go('https://search.brave.com')">Brave Search</button>
      <button onclick="go('https://wikipedia.org')">Wikipedia</button>
    </div>
  </main>

  <section id="set" hidden>
    <div class="head"><h3 data-i="3"></h3><button class="ib" onclick="closeSettings()">&#10005;</button></div>
    <label class="lbl" data-i="4"></label>
    <select id="lang"></select>
    <div id="opts"></div>
    <div class="row"><span data-i="15"></span><button class="pinbtn" id="pinbtn"></button></div>
    <button class="wipe" id="wipe" data-i="10"></button>
  </section>

  <section id="tabs" hidden>
    <div class="head"><h3 data-i="12"></h3><button class="ib" onclick="closeTabs()">&#10005;</button></div>
    <div id="tlist"></div>
    <button class="btn2 nt" onclick="newTabBtn()" data-i="13"></button>
    <button class="btn2 ca" onclick="closeAllTabs()" data-i="14"></button>
  </section>
</div>

<div id="kp" hidden>
  <button class="ib" id="kpx" onclick="closeKp()">&#10005;</button>
  <img src="logo.png" alt="">
  <div id="kpt"></div>
  <div id="kpe"></div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
</div>

const BAR=136;
const P={lang:"az",js:true,tp:true,clr:true,trk:true,https:false,shot:true};
const $=id=>document.getElementById(id);
let browsing=false;

try{Object.assign(P,JSON.parse(Android.getPrefs()))}catch(e){}

function T(i){const l=LANGS.find(x=>x[0]===P.lang)||LANGS[0];return l[2].split("|")[i]}
function save(){try{Android.savePrefs(JSON.stringify(P))}catch(e){}}
function full(f){try{Android.setFull(f,BAR)}catch(e){}}

function applyLang(){
  const rtl=["ar","fa","he"].includes(P.lang);
  document.documentElement.dir=rtl?"rtl":"ltr";
  document.documentElement.lang=P.lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(+e.dataset.i));
  $("url").placeholder=T(2);
}

const OPTS=[["js",5],["tp",6],["clr",7],["trk",8],["https",9],["shot",11]];

function renderChips(){
  $("chips").innerHTML=[["tp",6],["clr",7],["trk",8],["https",9],["shot",11],["js",5]]
    .map(([k,i])=>`<span class="chip ${P[k]?"on":"off"}"><b>${P[k]?"&#10003;":"&#10005;"}</b>${T(i)}</span>`).join("");
}

function buildSet(){
  $("opts").innerHTML=OPTS.map(([k,i])=>
    `<label class="row"><span>${T(i)}</span><input type="checkbox" data-k="${k}" ${P[k]?"checked":""}><u></u></label>`).join("");
  document.querySelectorAll("#opts input").forEach(c=>c.onchange=()=>{P[c.dataset.k]=c.checked;save();renderChips()});
}

function renderPin(){
  let has=false;try{has=Android.hasPin()}catch(e){}
  const b=$("pinbtn");b.dataset.has=has?"1":"";b.textContent=has?T(19):T(16);
}

function refresh(){applyLang();renderChips();buildSet();renderPin()}

/* ---------- tabs ---------- */
let TABS=[],CUR=0;
function onTabs(o){
  TABS=o.l;CUR=o.c;$("tc").textContent=TABS.length;
  if(!$("tabs").hidden)renderTabs();
}
function renderTabs(){
  const L=$("tlist");L.innerHTML="";
  TABS.forEach((t,i)=>{
    const d=document.createElement("div");d.className="tab"+(i===CUR?" cur":"");
    const tt=document.createElement("div");tt.className="tt";
    const b=document.createElement("b");b.textContent=t.t||t.u||"FoCUS";
    const s=document.createElement("small");s.textContent=t.u||"";
    tt.append(b,s);
    const x=document.createElement("button");x.className="ib";x.innerHTML="&#10005;";
    x.onclick=e=>{e.stopPropagation();Android.closeTab(i)};
    d.onclick=()=>Android.switchTab(i);
    d.append(tt,x);L.append(d);
  });
}
function openTabs(){
  $("home").hidden=true;$("set").hidden=true;$("tabs").hidden=false;
  renderTabs();full(true);
}
function closeTabs(){
  $("tabs").hidden=true;
  const t=TABS[CUR];browsing=!!(t&&t.u);
  $("url").value=browsing?t.u:"";
  if(browsing){full(false)}else{$("home").hidden=false}
}
function onSwitched(has){
  $("tabs").hidden=true;$("set").hidden=true;browsing=has;$("pg").style.width="0";
  $("home").hidden=has;if(!has)$("url").value="";
}
function newTabBtn(){Android.newTab();$("tabs").hidden=true;showHome()}
function closeAllTabs(){Android.closeAll();$("tabs").hidden=true;showHome()}

/* ---------- PIN keypad ---------- */
let kp={mode:"",buf:"",first:""};
function dots(){$("dots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<kp.buf.length?"f":""}"></i>`).join("")}
function kpTitle(){$("kpt").textContent=(kp.mode==="set"&&!kp.first)?T(16):T(17)}
function openKp(m){
  kp={mode:m,buf:"",first:""};
  $("kp").hidden=false;$("kpx").hidden=(m==="lock");$("kpe").textContent="";
  kpTitle();dots();
}
function closeKp(){$("kp").hidden=true;kp.buf="";kp.first=""}
function showLock(){if(!$("kp").hidden&&kp.mode==="lock")return;full(true);openKp("lock")}
function afterUnlock(){if(browsing&&$("set").hidden&&$("tabs").hidden&&!$("app").hidden)full(false)}
function kpErr(msg){
  $("kpe").textContent=msg;
  const d=$("dots");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");
  kp.buf="";dots();
}
function kpKey(k){
  if(k==="<"){kp.buf=kp.buf.slice(0,-1);dots();return}
  if(kp.buf.length>=4)return;
  kp.buf+=k;dots();$("kpe").textContent="";
  if(kp.buf.length===4)setTimeout(kpDone,120);
}
function kpDone(){
  const b=kp.buf;
  if(kp.mode==="lock"){
    const r=Android.checkPin(b);
    if(r===1){Android.unlocked();closeKp();afterUnlock()}
    else kpErr(r===-1?"\u23f3 30s":T(18));
  }else if(kp.mode==="set"){
    if(!kp.first){kp.first=b;kp.buf="";kpTitle();dots()}
    else if(kp.first===b){Android.setPin(b);closeKp();renderPin()}
    else{kp.first="";kpTitle();kpErr(T(18))}
  }else if(kp.mode==="rm"){
    const r=Android.removePin(b);
    if(r===1){closeKp();renderPin()}else kpErr(r===-1?"\u23f3 30s":T(18));
  }
}

function go(v){
  v=(v||$("url").value).trim();
  if(!v)return;
  $("url").blur();
  $("home").hidden=true;$("set").hidden=true;$("tabs").hidden=true;
  browsing=true;
  Android.go(v);
}
function showHome(){
  browsing=false;$("url").value="";$("pg").style.width="0";
  $("set").hidden=true;$("tabs").hidden=true;$("home").hidden=false;full(true);
}
function openSettings(){$("home").hidden=true;$("tabs").hidden=true;$("set").hidden=false;full(true)}
function closeSettings(){
  $("set").hidden=true;
  if(browsing){full(false)}else{$("home").hidden=false}
}
function onUrl(u){$("url").value=u;browsing=true}
function onProgress(p){const b=$("pg");b.style.width=p+"%";if(p>=100)setTimeout(()=>b.style.width="0",250)}
function onBackKey(){
  if(!$("kp").hidden){if(kp.mode!=="lock")closeKp();return "ok"}
  if(!$("tabs").hidden){closeTabs();return "ok"}
  if(!$("set").hidden){closeSettings();return "ok"}
  return "exit";
}

/* init */
$("lang").innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");
$("lang").value=P.lang;
$("lang").onchange=e=>{P.lang=e.target.value;save();refresh()};
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
$("enter").onclick=()=>{$("splash").hidden=true;$("app").hidden=false;showHome()};
$("wipe").onclick=()=>{
  try{Android.wipe()}catch(e){}
  const b=$("wipe");b.textContent="\u2713";setTimeout(()=>b.textContent=T(10),1200);
};
$("pad").innerHTML=["1","2","3","4","5","6","7","8","9","","0","<"].map(k=>k===""?"<span></span>":`<button onclick="kpKey('${k}')">${k==="<"?"&#9003;":k}</button>`).join("");
$("pinbtn").onclick=()=>openKp($("pinbtn").dataset.has?"rm":"set");
refresh();
try{onTabs(JSON.parse(Android.tabsJson()))}catch(e){}
try{if(Android.needsLock())showLock()}catch(e){}
</script>
