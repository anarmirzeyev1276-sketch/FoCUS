name: Build FoCUS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Check files
        run: |
          test -f index.html || (echo "index.html tapilmadi" && exit 1)
          test -f logoo.jpg || (echo "logoo.jpg tapilmadi (sekli logoo.jpg adi ile repoya yukle)" && exit 1)

      - name: Generate Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          A=android
          M=$A/app/src/main
          mkdir -p $M/java/com/focus/app $M/assets

          # ---- logo (round) + launcher icons ----
          convert logoo.jpg -resize 512x512! -alpha set \
            \( -size 512x512 xc:none -fill white -draw "circle 256,256 256,2" \) \
            -compose DstIn -composite logo_round.png
          cp logo_round.png $M/assets/logo.png
          cp index.html $M/assets/index.html
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $M/res/mipmap-$n
            convert logo_round.png -resize ${s}x${s} $M/res/mipmap-$n/ic_launcher.png
          done

          # ---- gradle files ----
          cat > $A/settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "FoCUS"
          include ':app'
          EOF

          cat > $A/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > $A/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > $A/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.focus.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.focus.app"
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName "1.1"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > $M/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="FoCUS"
              android:icon="@mipmap/ic_launcher"
              android:allowBackup="false"
              android:usesCleartextTraffic="true"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:windowSoftInputMode="adjustResize"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          # ---- native browser (Chromium WebView) ----
          cat > $M/java/com/focus/app/MainActivity.java <<'EOF'
          package com.focus.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayInputStream;
          import java.net.URLEncoder;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;

          public class MainActivity extends Activity {
            class Tab {
              WebView w;
              String title = "";
              String url = "";
            }

            WebView ui;
            FrameLayout holder;
            LinearLayout root;
            SharedPreferences sp;
            final ArrayList<Tab> tabs = new ArrayList<>();
            int cur = 0;
            boolean full = true;
            int barDp = 136;
            boolean js = true, tp = true, clr = true, trk = true, https = false, shot = true;
            volatile boolean needLock = true;
            int fails = 0;
            long lockedUntil = 0;

            static final String[] BLOCK = {
              "doubleclick.net", "googlesyndication.com", "google-analytics.com", "googletagmanager.com",
              "googleadservices.com", "googletagservices.com", "adservice.google.com", "facebook.net",
              "adnxs.com", "taboola.com", "outbrain.com", "scorecardresearch.com", "hotjar.com",
              "criteo.com", "criteo.net", "amazon-adsystem.com", "adsrvr.org", "quantserve.com",
              "mixpanel.com", "segment.io", "segment.com", "moatads.com", "mc.yandex.ru",
              "ads.twitter.com", "analytics.twitter.com", "analytics.tiktok.com", "app-measurement.com",
              "pubmatic.com", "rubiconproject.com", "openx.net", "casalemedia.com", "bat.bing.com",
              "clarity.ms", "krxd.net", "bluekai.com", "demdex.net", "everesttech.net", "adform.net",
              "smartadserver.com", "2mdn.net", "advertising.com", "yieldmo.com", "sharethrough.com"
            };

            // ---------------- prefs ----------------
            void loadPrefs() {
              try {
                JSONObject o = new JSONObject(sp.getString("p", "{}"));
                js = o.optBoolean("js", true);
                tp = o.optBoolean("tp", true);
                clr = o.optBoolean("clr", true);
                trk = o.optBoolean("trk", true);
                https = o.optBoolean("https", false);
                shot = o.optBoolean("shot", true);
              } catch (Exception e) { }
            }

            // ---------------- lifecycle ----------------
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              sp = getSharedPreferences("focus", MODE_PRIVATE);
              loadPrefs();
              getWindow().setStatusBarColor(Color.parseColor("#10222e"));
              getWindow().setNavigationBarColor(Color.parseColor("#0a1620"));
              applyShot();

              root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setBackgroundColor(Color.parseColor("#0a1620"));

              ui = new WebView(this);
              holder = new FrameLayout(this);
              setupUi();
              root.addView(ui);
              root.addView(holder);
              setContentView(root);

              addTab();
              layout();
              wipeAll();
              ui.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onResume() {
              super.onResume();
              if (needLock && hasPinN()) ui.evaluateJavascript("showLock()", null);
            }

            @Override
            protected void onStop() {
              super.onStop();
              needLock = true;
              if (hasPinN()) {
                full = true;
                layout();
              }
            }

            @Override
            protected void onDestroy() {
              if (clr) wipeAll();
              holder.removeAllViews();
              for (Tab t : tabs) t.w.destroy();
              tabs.clear();
              if (ui != null) ui.destroy();
              super.onDestroy();
            }

            @Override
            public void onBackPressed() {
              if (!full) {
                if (cw().canGoBack()) cw().goBack();
                else ui.evaluateJavascript("showHome()", null);
                return;
              }
              ui.evaluateJavascript("onBackKey()", v -> {
                if (v != null && v.contains("exit")) finish();
              });
            }

            // ---------------- UI webview ----------------
            void setupUi() {
              WebSettings s = ui.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(false);
              s.setBuiltInZoomControls(false);
              ui.setBackgroundColor(Color.parseColor("#0a1620"));
              ui.setOverScrollMode(View.OVER_SCROLL_NEVER);
              ui.addJavascriptInterface(new Bridge(), "Android");
              ui.setWebViewClient(new WebViewClient());
            }

            // ---------------- tabs ----------------
            Tab ct() { return tabs.get(cur); }

            WebView cw() { return tabs.get(cur).w; }

            boolean isCur(Tab t) { return cur < tabs.size() && tabs.get(cur) == t; }

            void addTab() {
              Tab t = new Tab();
              t.w = new WebView(this);
              setupWeb(t);
              holder.addView(t.w, new FrameLayout.LayoutParams(-1, -1));
              tabs.add(t);
              cur = tabs.size() - 1;
              showCur();
            }

            void showCur() {
              for (int i = 0; i < tabs.size(); i++) {
                WebView w = tabs.get(i).w;
                if (i == cur) {
                  w.setVisibility(View.VISIBLE);
                  w.onResume();
                } else {
                  w.setVisibility(View.GONE);
                  w.onPause();
                }
              }
              pushTabs();
            }

            void closeTab(int i) {
              if (i < 0 || i >= tabs.size()) return;
              Tab t = tabs.remove(i);
              holder.removeView(t.w);
              t.w.destroy();
              if (tabs.isEmpty()) {
                addTab();
                return;
              }
              if (cur > i) cur--;
              else if (cur >= tabs.size()) cur = tabs.size() - 1;
              showCur();
            }

            void closeAll() {
              for (Tab t : tabs) {
                holder.removeView(t.w);
                t.w.destroy();
              }
              tabs.clear();
              addTab();
            }

            void switchTab(int i) {
              if (i < 0 || i >= tabs.size()) return;
              cur = i;
              showCur();
              boolean has = !ct().url.isEmpty();
              full = !has;
              layout();
              ui.evaluateJavascript("onSwitched(" + has + ")", null);
              if (has) push(ct().url);
            }

            String tabsJson() {
              try {
                JSONArray a = new JSONArray();
                for (Tab t : new ArrayList<>(tabs)) {
                  JSONObject o = new JSONObject();
                  String ti = t.title == null ? "" : t.title;
                  if (ti.length() > 120) ti = ti.substring(0, 120);
                  o.put("t", ti);
                  o.put("u", t.url == null ? "" : t.url);
                  a.put(o);
                }
                JSONObject r = new JSONObject();
                r.put("l", a);
                r.put("c", cur);
                return r.toString();
              } catch (Exception e) {
                return "{\"l\":[],\"c\":0}";
              }
            }

            void pushTabs() {
              if (ui != null) ui.evaluateJavascript("onTabs(" + tabsJson() + ")", null);
            }

            // ---------------- content webview ----------------
            void setupWeb(final Tab t) {
              t.w.setBackgroundColor(Color.WHITE);
              applyWebSettings(t.w);
              t.w.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  if (trk && !r.isForMainFrame() && r.getUrl() != null && blocked(r.getUrl().getHost())) {
                    return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream(new byte[0]));
                  }
                  return null;
                }

                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  if (https && u.startsWith("http://")) {
                    v.loadUrl("https://" + u.substring(7), hdr());
                    return true;
                  }
                  // only http/https; other schemes (intent:, market: ...) are blocked
                  return !(u.startsWith("http://") || u.startsWith("https://"));
                }

                @Override
                public void onPageStarted(WebView v, String url, Bitmap f) {
                  t.url = url == null ? "" : url;
                  if (isCur(t)) push(t.url);
                }

                @Override
                public void onPageFinished(WebView v, String url) {
                  t.url = url == null ? "" : url;
                  if (isCur(t)) push(t.url);
                  pushTabs();
                }
              });
              t.w.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onProgressChanged(WebView v, int p) {
                  if (isCur(t)) ui.evaluateJavascript("onProgress(" + p + ")", null);
                }

                @Override
                public void onReceivedTitle(WebView v, String title) {
                  t.title = title == null ? "" : title;
                  pushTabs();
                }

                @Override
                public void onGeolocationPermissionsShowPrompt(String o, GeolocationPermissions.Callback c) {
                  c.invoke(o, false, false);
                }
              });
            }

            void applyWebSettings(WebView w) {
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(js);
              s.setDomStorageEnabled(js);
              s.setCacheMode(WebSettings.LOAD_NO_CACHE);
              s.setSaveFormData(false);
              s.setGeolocationEnabled(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              s.setJavaScriptCanOpenWindowsAutomatically(false);
              s.setSupportMultipleWindows(false);
              s.setBuiltInZoomControls(true);
              s.setDisplayZoomControls(false);
              s.setUseWideViewPort(true);
              s.setLoadWithOverviewMode(true);
              CookieManager cm = CookieManager.getInstance();
              cm.setAcceptCookie(true);
              cm.setAcceptThirdPartyCookies(w, !tp);
            }

            void applyShot() {
              if (shot) getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
              else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
            }

            boolean blocked(String h) {
              if (h == null) return false;
              for (String d : BLOCK) {
                if (h.equals(d) || h.endsWith("." + d)) return true;
              }
              return false;
            }

            Map<String, String> hdr() {
              Map<String, String> h = new HashMap<>();
              h.put("DNT", "1");
              h.put("Sec-GPC", "1");
              return h;
            }

            void push(String url) {
              ui.evaluateJavascript("onUrl(" + JSONObject.quote(url) + ")", null);
            }

            String search(String q) {
              try {
                return "https://duckduckgo.com/?q=" + URLEncoder.encode(q, "UTF-8");
              } catch (Exception e) {
                return "https://duckduckgo.com";
              }
            }

            String norm(String u) {
              u = u.trim();
              if (u.matches("^[a-zA-Z][a-zA-Z0-9+.\\-]*://.*")) {
                if (u.startsWith("http://") || u.startsWith("https://")) return u;
                return search(u);
              }
              if (!u.contains(" ") && (u.contains(".") || u.startsWith("localhost"))) return "https://" + u;
              return search(u);
            }

            void load(String raw) {
              String u = norm(raw);
              if (https && u.startsWith("http://")) u = "https://" + u.substring(7);
              full = false;
              layout();
              cw().loadUrl(u, hdr());
            }

            void layout() {
              float d = getResources().getDisplayMetrics().density;
              LinearLayout.LayoutParams a;
              if (full) {
                a = new LinearLayout.LayoutParams(-1, 0, 1f);
                holder.setVisibility(View.GONE);
              } else {
                a = new LinearLayout.LayoutParams(-1, (int) (barDp * d), 0f);
                holder.setVisibility(View.VISIBLE);
              }
              ui.setLayoutParams(a);
              holder.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));
              root.requestLayout();
            }

            void wipeAll() {
              try {
                CookieManager cm = CookieManager.getInstance();
                cm.removeAllCookies(null);
                cm.flush();
                WebStorage.getInstance().deleteAllData();
                GeolocationPermissions.getInstance().clearAll();
                for (Tab t : tabs) {
                  t.w.clearCache(true);
                  t.w.clearHistory();
                  t.w.clearFormData();
                }
              } catch (Exception e) { }
            }

            // ---------------- PIN ----------------
            boolean hasPinN() { return !sp.getString("pinh", "").isEmpty(); }

            String hash(String pin, String salt) {
              try {
                MessageDigest md = MessageDigest.getInstance("SHA-256");
                byte[] d = md.digest((salt + ":" + pin).getBytes("UTF-8"));
                StringBuilder sb = new StringBuilder();
                for (byte x : d) sb.append(String.format("%02x", x));
                return sb.toString();
              } catch (Exception e) {
                return "";
              }
            }

            synchronized int checkN(String pin) {
              if (System.currentTimeMillis() < lockedUntil) return -1;
              String h = sp.getString("pinh", "");
              String s = sp.getString("pins", "");
              if (pin != null && !h.isEmpty() && h.equals(hash(pin, s))) {
                fails = 0;
                return 1;
              }
              fails++;
              if (fails >= 5) {
                fails = 0;
                lockedUntil = System.currentTimeMillis() + 30000;
                return -1;
              }
              return 0;
            }

            // ---------------- JS bridge (only for local UI) ----------------
            class Bridge {
              @JavascriptInterface
              public void go(final String u) { runOnUiThread(() -> load(u)); }

              @JavascriptInterface
              public void back() { runOnUiThread(() -> { if (cw().canGoBack()) cw().goBack(); }); }

              @JavascriptInterface
              public void forward() { runOnUiThread(() -> { if (cw().canGoForward()) cw().goForward(); }); }

              @JavascriptInterface
              public void reload() { runOnUiThread(() -> cw().reload()); }

              @JavascriptInterface
              public void setFull(final boolean f, final int dp) {
                runOnUiThread(() -> {
                  full = f;
                  if (dp > 0) barDp = dp;
                  layout();
                });
              }

              @JavascriptInterface
              public String getPrefs() { return sp.getString("p", "{}"); }

              @JavascriptInterface
              public void savePrefs(final String json) {
                runOnUiThread(() -> {
                  sp.edit().putString("p", json).apply();
                  loadPrefs();
                  for (Tab t : tabs) applyWebSettings(t.w);
                  applyShot();
                  if (cw().getUrl() != null) cw().reload();
                });
              }

              @JavascriptInterface
              public void wipe() { runOnUiThread(() -> wipeAll()); }

              // tabs
              @JavascriptInterface
              public String tabsJson() { return MainActivity.this.tabsJson(); }

              @JavascriptInterface
              public void newTab() {
                runOnUiThread(() -> {
                  addTab();
                  full = true;
                  layout();
                });
              }

              @JavascriptInterface
              public void switchTab(final int i) { runOnUiThread(() -> MainActivity.this.switchTab(i)); }

              @JavascriptInterface
              public void closeTab(final int i) { runOnUiThread(() -> MainActivity.this.closeTab(i)); }

              @JavascriptInterface
              public void closeAll() {
                runOnUiThread(() -> {
                  MainActivity.this.closeAll();
                  full = true;
                  layout();
                });
              }

              // PIN
              @JavascriptInterface
              public boolean hasPin() { return hasPinN(); }

              @JavascriptInterface
              public boolean needsLock() { return needLock && hasPinN(); }

              @JavascriptInterface
              public void unlocked() { needLock = false; }

              @JavascriptInterface
              public boolean setPin(String pin) {
                if (pin == null || !pin.matches("\\d{4}")) return false;
                String salt = UUID.randomUUID().toString();
                sp.edit().putString("pins", salt).putString("pinh", hash(pin, salt)).apply();
                needLock = false;
                return true;
              }

              @JavascriptInterface
              public int checkPin(String pin) { return checkN(pin); }

              @JavascriptInterface
              public int removePin(String pin) {
                int r = checkN(pin);
                if (r == 1) sp.edit().remove("pinh").remove("pins").apply();
                return r;
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FoCUSV1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FoCUSV1.1
          path: FoCUSV1.1.apk

      - name: Release V1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.1
          name: FoCUS V1.1
          body: FoCUS V1.1 Chromium - PIN,DDATA CLEAR,Close All Tab! 
          files: FoCUSV1.1.apk
